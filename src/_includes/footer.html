{% assign t = site.data.translations[page.lang] %}
<footer class="flex justify-center border-t border-[#1e3a5f] bg-[#0a0f1a]">
    <div class="flex max-w-[960px] flex-1 flex-col">
        <footer class="flex flex-col gap-6 px-5 py-10 text-center @container">
            <div class="flex flex-wrap items-center justify-center gap-6 @[480px]:flex-row @[480px]:justify-around">
                  <a href="privacy" class="text-[#94a3b8] text-base font-normal leading-normal min-w-40 hover:text-[#22d3ee] transition-colors">{{ t.nav_privacy }}</a>
                  <a href="imprint" class="text-[#94a3b8] text-base font-normal leading-normal min-w-40 hover:text-[#22d3ee] transition-colors">{{ t.nav_impressum }}</a>
            </div>
            <div class="flex flex-wrap justify-center gap-4">
                <a href="https://www.linkedin.com/in/nico-bleh/" class="text-[#94a3b8] hover:text-[#22d3ee] transition-colors">
                    <div data-icon="LinkedinLogo" data-size="24px" data-weight="regular">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24px" height="24px" fill="currentColor"
                            viewBox="0 0 256 256">
                            <path
                                d="M216,24H40A16,16,0,0,0,24,40V216a16,16,0,0,0,16,16H216a16,16,0,0,0,16-16V40A16,16,0,0,0,216,24Zm0,192H40V40H216V216ZM96,112v64a8,8,0,0,1-16,0V112a8,8,0,0,1,16,0Zm88,28v36a8,8,0,0,1-16,0V140a20,20,0,0,0-40,0v36a8,8,0,0,1-16,0V112a8,8,0,0,1,15.79-1.78A36,36,0,0,1,184,140ZM100,84A12,12,0,1,1,88,72,12,12,0,0,1,100,84Z">
                            </path>
                        </svg>
                    </div>
                </a>
            </div>
            <p class="text-[#64748b] text-sm font-normal leading-normal">{{ t.footer_copyright }}</p>
        </footer>
    </div>
</footer>

<!-- Klaro Cookie Banner -->
<link
  rel="stylesheet"
  href="/styles/klaro.min.css"
/>
<script>
  window.klaroConfig = {
    translations: {
      de: {
        privacyPolicyUrl: '/privacy',
        consentModal: {
          title: 'Dienste-Einstellungen',
          description: 'Welche Dienste möchten Sie zulassen?'
        },
        purposes: {
          analytics: 'Analytics'
        },
        ok: 'Alle akzeptieren',
        cancel: 'Nur essenzielle Dienste akzeptieren'
      },
      en: {
        privacyPolicyUrl: '/en/privacy',
        consentModal: {
          title: 'Service Settings',
          description: 'Which services would you like to allow?'
        },
        purposes: {
          analytics: 'Analytics'
        },
        ok: 'Accept all',
        cancel: 'Accept essential cookies'
      }
    },
    storageMethod: 'cookie',
    cookieName: 'klaro',
    elementID: 'klaro',
    acceptAll: true,
    services: [
      {
        name: 'posthog',
        purposes: ['analytics'],
        default: false,
        optOut: true,
        translations: {
          de: {
            title: 'Web-Analyse',
            description: 'Sammelt anonymisierte Nutzungsdaten, um die Website zu verbessern.'
          },
          en: {
            title: 'Web Analytics',
            description: 'Collects anonymized usage data to improve the site.'
          }
        }
      }
    ]
  };
</script>
<script
  defer
  data-config="klaroConfig"
  src="/scripts/klaro.js"
></script>
