{% assign t = site.data.translations[page.lang] %}
<header style="display:flex;align-items:center;justify-content:space-between;padding:18px 40px;background:var(--bg);position:sticky;top:0;z-index:50;border-bottom:1px solid var(--border);">
  <a href="{{ page.lang == 'en' ? '/en/' : '/' }}" style="display:flex;align-items:center;gap:12px;text-decoration:none;">
    <div style="width:28px;height:28px;border-radius:4px;background:var(--accent);display:grid;place-items:center;font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;color:var(--bg);flex-shrink:0;">nb</div>
    <span style="color:var(--text);font-family:'Space Grotesk',Inter,sans-serif;font-size:16px;font-weight:600;letter-spacing:-0.3px;">Nico Bleh</span>
    <span style="color:var(--dim);font-family:'JetBrains Mono',monospace;font-size:12px;margin-left:4px;">// ai security</span>
  </a>
  <nav style="display:flex;align-items:center;gap:28px;">
    <a href="{{ page.lang == 'en' ? '/en/about' : '/about' }}" style="color:var(--muted);font-family:Inter,sans-serif;font-size:14px;font-weight:500;text-decoration:none;">{{ t.nav_about }}</a>
    <a href="{{ page.lang == 'en' ? '/en/portfolio' : '/portfolio' }}" style="color:var(--muted);font-family:Inter,sans-serif;font-size:14px;font-weight:500;text-decoration:none;">{{ t.nav_portfolio }}</a>
    <a href="{{ page.lang == 'en' ? '/en/blog' : '/blog' }}" style="color:var(--muted);font-family:Inter,sans-serif;font-size:14px;font-weight:500;text-decoration:none;">{{ t.nav_blog }}</a>
    <a href="{{ page.lang == 'en' ? '/en/contact' : '/contact' }}" style="color:var(--muted);font-family:Inter,sans-serif;font-size:14px;font-weight:500;text-decoration:none;">{{ t.nav_contact }}</a>
  </nav>
</header>
