{% assign t = site.data.translations[page.lang] %}
<h2 class="text-[#22d3ee] text-[22px] font-bold leading-tight tracking-[-0.015em] px-4 pb-3 pt-5">
  {{ t.areas_title }}
</h2>
<div class="grid grid-cols-[repeat(auto-fit,minmax(158px,1fr))] gap-3 p-4">

    <!-- Penetration Testing -->
    <div class="flex flex-1 gap-3 rounded-lg border border-[#1e3a5f] bg-[#111827] p-4 items-center card-glow">
        <div class="text-[#22d3ee]">
            <svg xmlns="http://www.w3.org/2000/svg" width="24px" height="24px" fill="none" viewBox="0 0 24 24">
                <path d="M9 3H5a2 2 0 0 0-2 2v4m6-6h10a2 2 0 0 1 2 2v4M9 3v18m0 0h10a2 2 0 0 0 2-2V9M9 21H5a2 2 0 0 1-2-2V9m0 0h18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </div>
        <h2 class="text-[#f1f5f9] text-base font-bold leading-tight">{{ t.expertise_pentest }}</h2>
    </div>

    <!-- Red Teaming -->
    <div class="flex flex-1 gap-3 rounded-lg border border-[#1e3a5f] bg-[#111827] p-4 items-center card-glow">
        <div class="text-[#22d3ee]">
            <svg xmlns="http://www.w3.org/2000/svg" width="24px" height="24px" fill="none" viewBox="0 0 24 24">
                <path d="M12 2L3 7V12C3 16.55 6.84 20.74 12 22C17.16 20.74 21 16.55 21 12V7L12 2Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
                <path d="M12 8v4m0 4h.01" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
        </div>
        <h2 class="text-[#f1f5f9] text-base font-bold leading-tight">{{ t.expertise_redteam }}</h2>
    </div>

    <!-- Security Audits -->
    <div class="flex flex-1 gap-3 rounded-lg border border-[#1e3a5f] bg-[#111827] p-4 items-center card-glow">
        <div class="text-[#22d3ee]">
            <svg xmlns="http://www.w3.org/2000/svg" width="24px" height="24px" fill="none" viewBox="0 0 24 24">
                <path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2M9 5a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2M9 5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2m-6 9l2 2 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </div>
        <h2 class="text-[#f1f5f9] text-base font-bold leading-tight">{{ t.expertise_audit }}</h2>
    </div>

    <!-- Awareness Training -->
    <div class="flex flex-1 gap-3 rounded-lg border border-[#1e3a5f] bg-[#111827] p-4 items-center card-glow">
        <div class="text-[#22d3ee]">
            <svg xmlns="http://www.w3.org/2000/svg" width="24px" height="24px" fill="none" viewBox="0 0 24 24">
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="9" cy="7" r="4" stroke="currentColor" stroke-width="1.5"/>
                <path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </div>
        <h2 class="text-[#f1f5f9] text-base font-bold leading-tight">{{ t.expertise_awareness }}</h2>
    </div>

    <!-- Cloud Security -->
    <div class="flex flex-1 gap-3 rounded-lg border border-[#1e3a5f] bg-[#111827] p-4 items-center card-glow">
        <div class="text-[#22d3ee]">
            <svg xmlns="http://www.w3.org/2000/svg" width="24px" height="24px" fill="none" viewBox="0 0 24 24">
                <path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </div>
        <h2 class="text-[#f1f5f9] text-base font-bold leading-tight">{{ t.expertise_cloud }}</h2>
    </div>

    <!-- AI Security (Coming Soon) -->
    <div class="flex flex-1 gap-3 rounded-lg border border-[#1e3a5f] bg-[#111827] p-4 items-center opacity-60 relative overflow-hidden">
        <div class="text-[#22d3ee]">
            <svg xmlns="http://www.w3.org/2000/svg" width="24px" height="24px" fill="none" viewBox="0 0 24 24">
                <path d="M12 2a5 5 0 1 1 0 10A5 5 0 0 1 12 2z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M17 8h2a2 2 0 0 1 2 2v1M7 8H5a2 2 0 0 0-2 2v1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
        </div>
        <div>
            <h2 class="text-[#f1f5f9] text-base font-bold leading-tight">{{ t.expertise_ai }}</h2>
            <span class="text-[10px] font-mono text-[#22d3ee] uppercase tracking-widest">Coming Soon</span>
        </div>
    </div>

</div>
