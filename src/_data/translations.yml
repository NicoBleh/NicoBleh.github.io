  # About
  about_lead: "Ob ein LLM-Agent in Produktion gehen darf, entscheidet die Architektur. Nicht der Modell-Benchmark."
  about_p2: "Ich bringe LLM- und Agentic-AI-Systeme in Produktion und halte sie dort betriebsfähig: Architektur und Delivery vom Use Case bis zum Rollout, Knowledge-Graph-Backbones mit Provenance und Audit-Trail, MLOps-Ketten, dazu Threat Modeling, Prompt-Injection-Defense, Secure RAG und IAM für Agenten."
  about_p3: "Was ich mitbringe: 13+ Jahre Engineering, davon rund 9 in Führungsverantwortung auf CTO- und Head-of-Ebene, durchgehend in regulierten Umfeldern (BaFin-FinTech, BASF-Enterprise, Pharma-Audit), dazu eine bewusste Spezialisierung auf offensive Web Security (HTB CWES, April 2026) und AI Red Teaming (HTB AI Red Teamer Path, laufend)."
  about_diff1: "Ich habe LLM-Features in Produktion gebracht (Opteinics Scope-3-Smart-Suggestions, Textbroker GenAI-Plattform) und kenne ihre Verwundbarkeiten von beiden Seiten."
  about_diff2: "Bei Creditshelf habe ich Engineering durch einen IPO inkl. EY-Audit geführt und Fraud Detection mit Graph-DB und ML produktiv ausgerollt. Auditierbare, reguliert deploybare AI ist für mich kein theoretisches Konzept."
  about_diff3: "HTB CWES (Certified Web Exploitation Specialist) ist mein Beleg, dass ich die Web-Schicht nicht nur baue, sondern auch breche. Genau die Schicht, an der die meisten LLM-Pre- und Post-Filter angegriffen werden."
  about_current1: "HTB AI Red Teamer Path (laufend, 2026)"
  about_current2: "Laufende LinkedIn-Content-Serie zu Agentic AI Security, Indirect Prompt Injection, Multi-Agent Authorization und AI-Zero-Days"
  about_current3: "Eigene Projekte in Arbeit: IOC-Extractor, Phishing-Klassifikator, Adversarial-ML-Reproduktionen"
  about_ready_label: "Bereit für:"
  about_ready_text: "AI Solution Architect, Lead / Director AI Engineering, Applied AI Lead, Senior Manager AI Security. DACH, hybrid oder remote."
