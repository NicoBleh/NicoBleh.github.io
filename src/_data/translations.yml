  professional_journey_title: "Beruflicher Werdegang"
  professional_journey_item1_text: "Chief Technology Officer · Opteinics (Mannheim): Gesamtverantwortung für sichere Architektur und Betrieb einer datengetriebenen SaaS-Plattform; Threat Modeling, IAM-Design und Angriffsflächen-Reduktion."
  professional_journey_item2_text: "Head of Technology · Textbroker EU (Mainz): Modernisierung der Infrastruktur mit Fokus auf sichere Cloud-Architekturen; Security-Standards in CI/CD und Code-Reviews."
