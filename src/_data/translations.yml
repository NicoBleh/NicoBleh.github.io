  services_list6: "AI Security: Sicherheitsbewertungen von KI-Systemen und LLM-Anwendungen, einschließlich Prompt Injection, unsichere RAG-Pipelines und weitere KI-spezifische Angriffsvektoren. (Demnächst verfügbar)"
  why_title: "Warum Nico Bleh?"
  why_list1: "Hands-On Expertise: Kein theoretisches Wissen, sondern echte Erfahrung aus der beruflichen Praxis."
  why_list2: "Klare Ergebnisse: Verständliche Berichte mit konkreten Prioritäten, nicht nur eine Liste von CVEs."
  why_list3: "Ganzheitlicher Ansatz: Technische Tiefe kombiniert mit strategischem Verständnis für Ihr Business."
  why_list4: "Vertrauen & Diskretion: Absolute Vertraulichkeit und professioneller Umgang mit sensiblen Findings."

